# Local MySQL 8 for EMS development.
#
#   docker compose up -d
#   python scripts/create_databases.py
#   alembic upgrade head
#
# Development only. It sets a weak root password on purpose so it can never be mistaken for a
# production definition, and it binds to localhost only. Production databases are provisioned
# outside this repository; see docs/DEPLOYMENT.md.
#
# If a MySQL 8 server is already running on 3306 (a native service, for example), skip this
# file entirely and point DATABASE_URL at that server.

services:
  mysql:
    image: mysql:8.4
    container_name: ems-mysql
    restart: unless-stopped
    environment:
      # Local-only credentials. Never reuse these anywhere that matters.
      MYSQL_ROOT_PASSWORD: ems-local-dev
      MYSQL_DATABASE: ems
    ports:
      # Bound to the loopback interface so the container is not reachable off-host.
      - "127.0.0.1:3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # Match the production expectations the application relies on, so local behaviour is
      # not more forgiving than deployed behaviour:
      #   READ-COMMITTED  — §18.8 requires it for the salary-timeline overlap check
      #   STRICT_ALL_TABLES — without it MySQL truncates instead of raising
      #   sql_require_primary_key — every EMS table declares a UUID primary key (DEC-042)
      - --transaction-isolation=READ-COMMITTED
      - --sql-mode=STRICT_ALL_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION,NO_ZERO_DATE,NO_ZERO_IN_DATE
      - --sql-require-primary-key=ON
      # Keeps the ~2s first-connection cost of reverse DNS lookups out of local runs (DEC-044).
      - --skip-name-resolve
    volumes:
      - ems_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pems-local-dev"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ems_mysql_data:
